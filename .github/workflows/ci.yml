# Verifica cada cambio antes de que llegue a producción: lint, tests y
# que el proyecto compile. A diferencia de los demás workflows de esta
# carpeta (backup, recordatorios...), este no dispara nada en la propia
# app — solo informa aquí, en GitHub, si algo se rompió.
#
# De momento solo avisa (una ✗ roja en el Pull Request o el commit): no
# bloquea que Vercel despliegue igualmente. Bloquear el despliegue de
# verdad es un paso aparte (regla de protección de rama en GitHub).

name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      # El lint ya tenía avisos y errores sueltos en código existente antes
      # de este workflow (sin relación con los cambios de robustez) — se
      # deja en modo "solo informa" (continue-on-error) para que de entrada
      # no salga todo en rojo por algo que no tiene que ver con el cambio
      # que se está revisando. Arreglarlos de verdad es tarea aparte.
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build
        env:
          # Valores de relleno: el build no necesita credenciales reales
          # para compilar, solo que estas variables existan.
          NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder"
