# Verifica cada cambio antes de que llegue a producción: tipos, lint,
# vulnerabilidades conocidas, tests y que el proyecto compile. A
# diferencia de los demás workflows de esta carpeta (backup,
# recordatorios...), este no dispara nada en la propia app — solo
# informa aquí, en GitHub, si algo se rompió.
#
# 13/11/2026: el lint ya se arregló de verdad (ya no hace falta
# continue-on-error) y se añaden tsc y npm audit. Para que un ✗ rojo
# aquí bloquee de verdad el merge en GitHub (hoy solo avisa, no lo
# impide) falta un paso aparte que no se puede hacer desde este
# repo: Diego tiene que activar, en GitHub → Settings → Branches →
# Add rule (sobre la rama a proteger), "Require status checks to pass
# before merging" y marcar el job "verificar" de este workflow.

name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Informa de vulnerabilidades sin bloquear todavía. 13/11/2026:
      # ya se resolvieron 7 de las 17 originales (zod, node-forge,
      # vite, source-map-js, brace-expansion...) sin tocar nada a
      # mano con fixes compatibles. Quedan 10, las dos "altas"
      # concentradas en joi (vía passkit-generator, la librería de
      # tarjetas de Apple Wallet: el fix real exige un salto de
      # versión "breaking" de passkit-generator que no se puede
      # probar de verdad sin certificados reales de Apple) y las 8
      # "moderadas" en el propio eslint-config-next (su fix real es,
      # según el propio npm audit, una vuelta atrás a una versión
      # anterior de eslint-config-next, que no tiene sentido con
      # Next.js 16.4.6). Pasar a bloquear (quitar continue-on-error)
      # es tarea aparte, una vez resueltas de verdad.
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm test
      - run: npm run build
        env:
          # Valores de relleno: el build no necesita credenciales reales
          # para compilar, solo que estas variables existan.
          NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder"
